# Agent007 - Docker Compose
# Development environment setup

version: '3.8'

services:
  # ==========================================================================
  # API Server
  # ==========================================================================
  api:
    build:
      context: .
      target: development
    container_name: agent007-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://agent007:agent007_secret@postgres:5432/agent007_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-in-production-min-32-chars
      - ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - LOG_LEVEL=debug
    volumes:
      - ./src:/app/src:ro
      - ./database:/app/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent007-network
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: agent007-postgres
    environment:
      POSTGRES_USER: agent007
      POSTGRES_PASSWORD: agent007_secret
      POSTGRES_DB: agent007_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent007 -d agent007_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent007-network
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: agent007-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent007-network
    restart: unless-stopped

  # ==========================================================================
  # Adminer (Database UI) - Development only
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: agent007-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - agent007-network
    profiles:
      - dev-tools

# =============================================================================
# Networks
# =============================================================================
networks:
  agent007-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  redis-data:
