# Fly.io configuration for Agent007 API

app = "agent007-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"

# Set secrets via: fly secrets set KEY=VALUE
# Required secrets:
#   DATABASE_URL
#   JWT_SECRET
#   ENCRYPTION_MASTER_KEY
#   BLOCKCHAIN_PRIVATE_KEY
#   BLOCKCHAIN_CONTRACT_ADDRESS
