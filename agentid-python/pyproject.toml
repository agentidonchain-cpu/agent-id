[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentid"
version = "0.1.0"
description = "AgentID SDK - Decentralized identity for AI agents on Base blockchain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "AgentID", email = "dev@id-agent.org" }
]
keywords = [
    "agentid",
    "ai-agents",
    "identity",
    "blockchain",
    "base",
    "langchain",
    "crewai",
    "autogpt"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
]
crewai = [
    "crewai>=0.1.0",
]
autogpt = [
    "autogpt-forge>=0.1.0",
]
all = [
    "agentid[langchain,crewai,autogpt]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://id-agent.org"
Documentation = "https://id-agent.org/docs"
Repository = "https://github.com/anthropics/agent-id"

[tool.hatch.build.targets.wheel]
packages = ["agentid"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
